app = 'tothemoon'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = 'tcp'
  internal_port = 80
  [[services.ports]]
    handlers = ['http']
    port = 80
  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443