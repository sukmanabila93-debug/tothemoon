app = 'tothemoon'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 80
  [[services.ports]]
    handlers = ['http']
    port = 80
  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

[checks]
  [checks.status]
    port = 80
    type = 'http'
    interval = '10s'
    timeout = '2s'
    path = '/'